set -g default-terminal "tmux-256color"
# set-option -g default-shell "nu"
set-option -g default-command "nu"

set-option -g -s status-interval 1
set-option -g display-time 5000
set-option -g repeat-time 2000

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
unbind v
bind v split-window -h 

unbind '"'
unbind h
bind h split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r C-h resize-pane -L 2
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 2

bind z resize-pane -Z

bind-key S swap-window -t 0

bind C-Space popup -h 11 -BE '~/bin/tmux-session'

bind-key -n M-o run-shell "~/bin/tmux-session previous"
bind-key -n M-i run-shell "~/bin/tmux-session next"

unbind C-n
bind C-n popup -h 10 -BE '~/.config/sh/submodule.sh'

unbind ';'
bind ';' popup -E 'nvim -u ~/.config/nvim/popup.lua -S ~/.local/state/popup.vim'

unbind 'a'
bind 'a' run -b '~/.config/tmux/attach-popup.sh'

unbind o
unbind C-o
bind o popup -h 10 -BE '~/.config/tmux/fzf-url.sh'
bind C-o popup -h 10 -BE '~/.config/tmux/fzf-url.sh'

unbind 'g'
bind 'g' run "tmux set-buffer $(cat ~/.git-credentials | awk -F'[/:@]' '{print $4}')\r"\; paste-buffer\;\
         run "sleep 0.2"\;\
         run "tmux set-buffer $(cat ~/.git-credentials | awk -F'[/:@]' '{print $5}')\r"\; paste-buffer\;\
         run "tmux set-buffer ''"

unbind 'l'
bind 'l' popup -E 'tmux attach -t _wp'

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# Status bar at the top
set-option -g status-position top

# Go to next session instead of exiting tmux
set-option -g detach-on-destroy off

set-option -g renumber-windows on
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

set -g @fzf-url-bind 'o'
set -g @fzf-url-fzf-options '-w 50% -h 10 --multi'

source ~/.config/tmux/colors.conf

set-option -g status-left-length "100"
set-option -g status-right-length "100"

set -gq status-style "bg=#{@background},fg=#{@foreground}"

# Left
set-option -g "status-left" ""
set-window-option -g window-status-separator " "
set-option -gq "window-status-format" "#[fg=#{@primary_50},bg=#{@background}]#[fg=#{@background},bg=#{@primary_50}]#I #[fg=#{@primary_50},bg=#{@gray2}]#[fg=#{@gray8},bg=#{@gray2}] #W #[fg=#{@gray2},bg=#{@background}]"
set-option -gq "window-status-current-format" "#[fg=#{@primary},bg=#{@background},bold]#[bg=#{@primary}]#[fg=#{@background},bold]#I #[fg=#{@primary},bg=#{@gray3}]#[fg=#{@foreground},bg=#{@gray3}] #W #[fg=#{@gray3},bg=#{@background}]"

# Right
set-option -g "status-right" "#[fg=#{@gray3},bg=#{@background}]#[fg=#{@foreground},bg=#{@gray3}] #{s|+|$|:#{s|$HOME|~>|:#{session_path}}}#{?client_prefix,#[fg=#{@active}],#[fg=#{@primary}]}#[bg=#{@background}]#[bg=#{@gray3}] #{?client_prefix,#[bg=#{@active}],#[bg=#{@primary}]}#[fg=#{@background},bold]  #{?client_prefix,#[fg=#{@active}],#[fg=#{@primary}]}#[bg=#{@background},bold]"

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'if-shell "[ $(tmux display-message -p #{pane_at_left})    -eq 1 ]" "previous-window" "select-pane -L"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'if-shell "[ $(tmux display-message -p #{pane_at_right}) -eq 1 ]" "next-window" "select-pane -R"'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

